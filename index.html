<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandpixels - Sandbox Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            font-size: 2rem;
            color: #4caf50;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }

        #canvas-container {
            position: relative;
            background: #000000;
            border: 3px solid #2d2d2d;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            overflow: hidden;
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            cursor: crosshair;
        }

        .ui-panel {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 12px;
        }

        .category-row {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 8px;
            overflow-x: auto;
        }

        .category-btn {
            background: #252525;
            border: 1px solid #333;
            color: #aaa;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .category-btn.active {
            color: #ffffff;
            background-color: #4caf50;
            border-color: #4caf50;
        }

        .element-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 50px;
        }

        .element-btn {
            background-color: #2a2a2a;
            color: #eee;
            border: 1px solid #3a3a3a;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .element-btn:hover {
            background-color: #3a3a3a;
            border-color: #555;
        }

        .element-btn.active {
            background-color: var(--elem-color, #4caf50);
            color: #000 !important;
            font-weight: bold;
            border-color: transparent;
            box-shadow: 0 0 8px var(--elem-color);
        }

        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #2d2d2d;
        }

        .info-text {
            font-size: 0.85rem;
            color: #aaa;
        }

        .action-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .action-btn:hover {
            background-color: #f44336;
        }
    </style>
</head>
<body>

    <h1>Sandpixels</h1>
    <p style="font-size: 0.85rem; color: #888; margin-bottom: 15px;">Simulador estilo Sandboxels em tempo real</p>

    <div id="game-wrapper">
        <div id="canvas-container">
            <canvas id="sandCanvas"></canvas>
        </div>

        <div class="ui-panel">
            <!-- Categorias -->
            <div class="category-row">
                <button class="category-btn active" data-cat="solids">Sólidos</button>
                <button class="category-btn" data-cat="liquids">Líquidos</button>
                <button class="category-btn" data-cat="gases">Gases</button>
                <button class="category-btn" data-cat="special">Especiais</button>
            </div>
            
            <!-- Grid de Elementos Dinâmicos -->
            <div class="element-grid" id="elements"></div>
        </div>

        <div class="bottom-controls">
            <div class="info-text">
                Elemento: <span id="elem-name" style="font-weight:bold;">Areia</span> | 
                Pixels: <span id="pixel-count" style="color: #4caf50; font-weight: bold;">0</span>
            </div>
            <button class="action-btn" id="clearBtn">Limpar Tudo</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sandCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const elementsGrid = document.getElementById('elements');
        const elemNameDisplay = document.getElementById('elem-name');
        const pixelCountDisplay = document.getElementById('pixel-count');

        // Configuração da Resolução Interna Pixelada
        const CELL_SIZE = 4;
        const WIDTH = 160;
        const HEIGHT = 110;

        canvas.width = WIDTH * CELL_SIZE;
        canvas.height = HEIGHT * CELL_SIZE;

        // Banco de Dados Completo de Elementos (Estilo Sandboxels)
        const ELEMENTS = {
            // SÓLIDOS
            sand: { name: "Areia", color: "#e0b034", cat: "solids", type: "powder" },
            wood: { name: "Madeira", color: "#8b5a2b", cat: "solids", type: "solid", flammable: true },
            stone: { name: "Pedra", color: "#7a7a7a", cat: "solids", type: "solid" },
            plant: { name: "Planta", color: "#2e8b57", cat: "solids", type: "solid", flammable: true },
            salt: { name: "Sal", color: "#ffffff", cat: "solids", type: "powder" },
            ice: { name: "Gelo", color: "#a5f2f3", cat: "solids", type: "solid" },
            
            // LÍQUIDOS
            water: { name: "Água", color: "#4169e1", cat: "liquids", type: "liquid" },
            oil: { name: "Óleo", color: "#b8860b", cat: "liquids", type: "liquid", flammable: true },
            acid: { name: "Ácido", color: "#00ff00", cat: "liquids", type: "liquid" },
            lava: { name: "Lava", color: "#ff4500", cat: "liquids", type: "liquid" },

            // GASES
            smoke: { name: "Fumaça", color: "#555555", cat: "gases", type: "gas" },
            steam: { name: "Vapor", color: "#cccccc", cat: "gases", type: "gas" },
            gasoline: { name: "Gás Combus.", color: "#a49b80", cat: "gases", type: "gas", flammable: true },

            // ESPECIAIS
            fire: { name: "Fogo", color: "#ff6600", cat: "special", type: "energy" },
            cinder: { name: "Cinza", color: "#3a3a3a", cat: "special", type: "powder" },
            eraser: { name: "Borracha", color: "#ff00ff", cat: "special", type: "tool" }
        };

        let currentElement = 'sand';
        let currentCategory = 'solids';
        let grid = makeGrid();
        let isDrawing = false;

        function makeGrid() {
            let arr = new Array(WIDTH);
            for (let x = 0; x < WIDTH; x++) {
                arr[x] = new Array(HEIGHT).fill(0);
            }
            return arr;
        }

        // Renderiza perfeitamente os botões corrigidos
        function renderUI() {
            elementsGrid.innerHTML = '';
            for (let key in ELEMENTS) {
                if (ELEMENTS[key].cat === currentCategory) {
                    const btn = document.createElement('button');
                    btn.className = 'element-btn';
                    if (currentElement === key) btn.classList.add('active');
                    btn.innerText = ELEMENTS[key].name;
                    btn.style.setProperty('--elem-color', ELEMENTS[key].color);
