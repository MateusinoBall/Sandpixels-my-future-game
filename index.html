<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandpixels - Sandbox Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            color: #4caf50;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 15px;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }

        #canvas-container {
            position: relative;
            background: #000000;
            border: 3px solid #2d2d2d;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            overflow: hidden;
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            cursor: crosshair;
        }

        /* Interface estilo Sandboxels */
        .ui-panel {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            padding: 12px;
        }

        .category-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            overflow-x: auto;
        }

        .category-btn {
            background: none;
            border: none;
            color: #888;
            padding: 4px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .category-btn.active {
            color: #4caf50;
            border-bottom: 2px solid #4caf50;
        }

        .element-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px;
        }

        .element-btn {
            background-color: #2a2a2a;
            color: #eee;
            border: 1px solid #3a3a3a;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .element-btn:hover {
            background-color: #3a3a3a;
            border-color: #555;
        }

        .element-btn.active {
            background-color: var(--elem-color, #4caf50);
            color: #000;
            font-weight: bold;
            border-color: transparent;
        }

        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .action-btn:hover {
            background-color: #f44336;
        }
    </style>
</head>
<body>

    <h1>Sandpixels</h1>
    <div class="subtitle">Selecione os elementos abaixo para criar reações físicas e químicas!</div>

    <div id="game-wrapper">
        <div id="canvas-container">
            <canvas id="sandCanvas"></canvas>
        </div>

        <div class="ui-panel">
            <!-- Categorias -->
            <div class="category-row" id="categories">
                <button class="category-btn active" onclick="switchCategory('solids')">Sólidos</button>
                <button class="category-btn" onclick="switchCategory('liquids')">Líquidos</button>
                <button class="category-btn" onclick="switchCategory('gases')">Gases</button>
                <button class="category-btn" onclick="switchCategory('special')">Especiais</button>
            </div>
            
            <!-- Elementos da Categoria Selecionada -->
            <div class="element-grid" id="elements"></div>
        </div>

        <div class="bottom-controls">
            <div id="current-info" style="font-size: 0.9rem; color: #aaa;">Elemento: <span id="elem-name" style="font-weight:bold; color: #fff;">Areia</span></div>
            <button class="action-btn" id="clearBtn">Limpar Tudo</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sandCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const elementsGrid = document.getElementById('elements');
        const elemNameDisplay = document.getElementById('elem-name');

        // Configuração da Matrix (Resolução interna pixelada)
        const CELL_SIZE = 4;
        const WIDTH = 150;
        const HEIGHT = 110;

        canvas.width = WIDTH * CELL_SIZE;
        canvas.height = HEIGHT * CELL_SIZE;

        // Definição Completa de Elementos (Estilo Sandboxels)
        const ELEMENTS = {
            // SÓLIDOS
            sand: { name: "Areia", color: "#e0b034", cat: "solids", type: "powder" },
            wood: { name: "Madeira", color: "#8b5a2b", cat: "solids", type: "solid", flammable: true },
            stone: { name: "Pedra", color: "#7a7a7a", cat: "solids", type: "solid" },
            plant: { name: "Planta", color: "#2e8b57", cat: "solids", type: "solid", flammable: true },
            
            // LÍQUIDOS
            water: { name: "Água", color: "#4169e1", cat: "liquids", type: "liquid" },
            oil: { name: "Óleo", color: "#b8860b", cat: "liquids", type: "liquid", flammable: true },
            acid: { name: "Ácido", color: "#00ff00", cat: "liquids", type: "liquid" },

            // GASES
            smoke: { name: "Fumaça", color: "#555555", cat: "gases", type: "gas" },
            steam: { name: "Vapor", color: "#cccccc", cat: "gases", type: "gas" },

            // ESPECIAIS
            fire: { name: "Fogo", color: "#ff4500", cat: "special", type: "energy" },
            eraser: { name: "Borracha", color: "#ff00ff", cat: "special", type: "tool" }
        };

        let currentElement = 'sand';
        let currentCategory = 'solids';

        // Criação e inicialização das matrizes de estado do jogo
        // Cada célula guarda um objeto { id: 'sand', color: '#...', lifetime: 0 } ou 0 para vazio
        let grid = makeGrid();
        let isDrawing = false;

        function makeGrid() {
            let arr = new Array(WIDTH);
            for (let x = 0; x < WIDTH; x++) {
                arr[x] = new Array(HEIGHT).fill(0);
            }
            return arr;
        }

        // Renderiza botões baseados na categoria ativa
        function updateUI() {
            elementsGrid.innerHTML = '';
            for (let key in ELEMENTS) {
                if (ELEMENTS[key].cat === currentCategory) {
                    const btn = document.createElement('button');
                    btn.className = `element-btn ${currentElement === key ? 'active' : ''}`;
                    btn.innerText = ELEMENTS[key].name;
                    btn.style.setProperty('--elem-color', ELEMENTS[key].color);
                    if(ELEMENTS[key].color === "#ffffff" || ELEMENTS[key].color === "#00ff00" || ELEMENTS[key].color === "#cccccc") {
                        btn.style.color = "#000";
                    }
                    btn.onclick = () => selectElement(key);
                    elementsGrid.appendChild(btn);
                }
            }
            elemNameDisplay.innerText = ELEMENTS[currentElement].name;
            elemNameDisplay.style.color = ELEMENTS[currentElement].color;
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Auto seleciona o primeiro elemento da nova categoria
            for (let key in ELEMENTS) {
                if (ELEMENTS[key].cat === cat) {
                    currentElement = key;
                    break;
                }
            }
